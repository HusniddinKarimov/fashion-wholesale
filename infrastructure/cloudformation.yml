AWSTemplateFormatVersion: "2010-09-09"
Description: >
  FashionWholesale Corp — Full AWS Production Stack
  VPC · ALB · Auto Scaling Group · RDS PostgreSQL · ECR · IAM · CloudWatch

# ─── Parameters ──────────────────────────────────────────────────────────────
Parameters:
  EnvironmentName:
    Type: String
    Default: fashionwholesale
    Description: Prefix for all resource names

  VpcCidr:
    Type: String
    Default: "10.0.0.0/16"

  PublicSubnet1Cidr:
    Type: String
    Default: "10.0.1.0/24"

  PublicSubnet2Cidr:
    Type: String
    Default: "10.0.2.0/24"

  PrivateSubnet1Cidr:
    Type: String
    Default: "10.0.10.0/24"

  PrivateSubnet2Cidr:
    Type: String
    Default: "10.0.11.0/24"

  InstanceType:
    Type: String
    Default: t3.micro
    AllowedValues: [t3.micro, t3.small, t3.medium, t3.large]
    Description: EC2 instance type for app servers (t3.micro is Free Tier eligible)

  AsgMinSize:
    Type: Number
    Default: 2
    Description: Minimum number of EC2 instances

  AsgMaxSize:
    Type: Number
    Default: 6
    Description: Maximum number of EC2 instances

  AsgDesiredSize:
    Type: Number
    Default: 2
    Description: Desired number of EC2 instances

  DBInstanceClass:
    Type: String
    Default: db.t3.micro
    AllowedValues: [db.t3.micro, db.t3.small, db.t3.medium]

  DBBackupRetentionDays:
    Type: Number
    Default: 0
    MinValue: 0
    MaxValue: 35
    Description: >
      Automated backup retention in days. Free Tier accounts must use 0.
      Bump to 7+ once the account plan is upgraded.

  DBName:
    Type: String
    Default: fashionwholesale

  DBUsername:
    Type: String
    Default: fwadmin
    NoEcho: false

  DBPassword:
    Type: String
    NoEcho: true
    MinLength: 12
    Description: RDS master password (min 12 chars)

  AppImageUri:
    Type: String
    Default: "nginx:alpine"
    Description: ECR image URI (updated by CI/CD after first deploy)

  KeyPairName:
    Type: String
    Default: ""
    Description: EC2 Key Pair for SSH access (optional)

  GitHubOrg:
    Type: String
    Description: GitHub username or org that owns the repo (for OIDC trust scoping)

  GitHubRepo:
    Type: String
    Default: fashion-wholesale
    Description: GitHub repository name (for OIDC trust scoping)

# ─── Conditions ──────────────────────────────────────────────────────────────
Conditions:
  HasKeyPair: !Not [!Equals [!Ref KeyPairName, ""]]

# ─── Resources ───────────────────────────────────────────────────────────────
Resources:

  # ════════════════════════════════════════════════════════════════════════════
  # 1. NETWORKING
  # ════════════════════════════════════════════════════════════════════════════

  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub "${EnvironmentName}-vpc"

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub "${EnvironmentName}-igw"

  IGWAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway

  # Public Subnets (ALB lives here)
  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Ref PublicSubnet1Cidr
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub "${EnvironmentName}-public-1"

  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Ref PublicSubnet2Cidr
      AvailabilityZone: !Select [1, !GetAZs ""]
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub "${EnvironmentName}-public-2"

  # Private Subnets (EC2 app servers + RDS live here)
  PrivateSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Ref PrivateSubnet1Cidr
      AvailabilityZone: !Select [0, !GetAZs ""]
      Tags:
        - Key: Name
          Value: !Sub "${EnvironmentName}-private-1"

  PrivateSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Ref PrivateSubnet2Cidr
      AvailabilityZone: !Select [1, !GetAZs ""]
      Tags:
        - Key: Name
          Value: !Sub "${EnvironmentName}-private-2"

  # NAT Gateway so private subnets can reach internet (ECR pulls, etc.)
  EIP1:
    Type: AWS::EC2::EIP
    DependsOn: IGWAttachment
    Properties:
      Domain: vpc

  NatGateway1:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt EIP1.AllocationId
      SubnetId: !Ref PublicSubnet1
      Tags:
        - Key: Name
          Value: !Sub "${EnvironmentName}-nat-1"

  # Route Tables
  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub "${EnvironmentName}-public-rt"

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: IGWAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: "0.0.0.0/0"
      GatewayId: !Ref InternetGateway

  PublicSubnet1RouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet1
      RouteTableId: !Ref PublicRouteTable

  PublicSubnet2RouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet2
      RouteTableId: !Ref PublicRouteTable

  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub "${EnvironmentName}-private-rt"

  PrivateRoute:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      DestinationCidrBlock: "0.0.0.0/0"
      NatGatewayId: !Ref NatGateway1

  PrivateSubnet1RouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet1
      RouteTableId: !Ref PrivateRouteTable

  PrivateSubnet2RouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet2
      RouteTableId: !Ref PrivateRouteTable

  # ════════════════════════════════════════════════════════════════════════════
  # 2. SECURITY GROUPS
  # ════════════════════════════════════════════════════════════════════════════

  ALBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: ALB - allow HTTP/HTTPS from internet
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: "0.0.0.0/0"
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: "0.0.0.0/0"
      Tags:
        - Key: Name
          Value: !Sub "${EnvironmentName}-alb-sg"

  AppSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: App EC2 - allow traffic from ALB only
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 3000
          ToPort: 3000
          SourceSecurityGroupId: !Ref ALBSecurityGroup
      Tags:
        - Key: Name
          Value: !Sub "${EnvironmentName}-app-sg"

  DBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: RDS - allow PostgreSQL from app servers only
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref AppSecurityGroup
      Tags:
        - Key: Name
          Value: !Sub "${EnvironmentName}-db-sg"

  # ════════════════════════════════════════════════════════════════════════════
  # 3. ECR REPOSITORY
  # ════════════════════════════════════════════════════════════════════════════

  ECRRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub "${EnvironmentName}/app"
      ImageScanningConfiguration:
        ScanOnPush: true
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [{
              "rulePriority": 1,
              "description": "Keep last 10 images",
              "selection": {
                "tagStatus": "any",
                "countType": "imageCountMoreThan",
                "countNumber": 10
              },
              "action": { "type": "expire" }
            }]
          }
      Tags:
        - Key: Name
          Value: !Sub "${EnvironmentName}-ecr"

  # ════════════════════════════════════════════════════════════════════════════
  # 4. IAM — EC2 Instance Role (ECR pull + SSM + CloudWatch)
  # ════════════════════════════════════════════════════════════════════════════

  EC2InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${EnvironmentName}-ec2-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonEC2ContainerRegistryReadOnly
        - arn:aws:iam::aws:policy/CloudWatchAgentServerPolicy
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: SSMParameterAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - ssm:GetParameter
                  - ssm:GetParameters
                  - ssm:GetParametersByPath
                Resource: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${EnvironmentName}/*"

  EC2InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: !Sub "${EnvironmentName}-ec2-profile"
      Roles:
        - !Ref EC2InstanceRole

  # IAM Role for GitHub Actions OIDC (no long-lived keys)
  GitHubActionsRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${EnvironmentName}-github-actions"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub "arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com"
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringLike:
                "token.actions.githubusercontent.com:sub": !Sub "repo:${GitHubOrg}/${GitHubRepo}:*"
              StringEquals:
                "token.actions.githubusercontent.com:aud": "sts.amazonaws.com"
      Policies:
        - PolicyName: CICDPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - ecr:GetAuthorizationToken
                  - ecr:BatchCheckLayerAvailability
                  - ecr:GetDownloadUrlForLayer
                  - ecr:BatchGetImage
                  - ecr:InitiateLayerUpload
                  - ecr:UploadLayerPart
                  - ecr:CompleteLayerUpload
                  - ecr:PutImage
                Resource: "*"
              # Rolling deploys are driven purely by an instance refresh.
              # New instances read the image tag from SSM at boot, so the CI
              # role needs no launch-template / RunInstances permissions.
              - Effect: Allow
                Action:
                  - autoscaling:StartInstanceRefresh
                Resource: !Sub "arn:aws:autoscaling:${AWS::Region}:${AWS::AccountId}:autoScalingGroup:*:autoScalingGroupName/${EnvironmentName}-asg"
              # Describe* and CloudFormation read actions don't support
              # resource-level permissions, so they must target "*".
              - Effect: Allow
                Action:
                  - autoscaling:DescribeInstanceRefreshes
                  - cloudformation:DescribeStacks
                Resource: "*"
              - Effect: Allow
                Action:
                  - ssm:PutParameter
                  - ssm:GetParameter
                Resource: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${EnvironmentName}/*"

  # ════════════════════════════════════════════════════════════════════════════
  # 5. SSM PARAMETERS
  #
  # NOTE: SecureString parameters cannot be created by CloudFormation
  # (AWS::SSM::Parameter only supports String/StringList). The secrets
  # /${EnvironmentName}/NEXTAUTH_SECRET and /${EnvironmentName}/DB_PASSWORD
  # are created out-of-band via `aws ssm put-parameter --type SecureString`
  # during deployment (see infrastructure/setup.sh). The EC2 instance role
  # is granted read access to /${EnvironmentName}/* above.
  # ════════════════════════════════════════════════════════════════════════════

  # ════════════════════════════════════════════════════════════════════════════
  # 6. RDS POSTGRESQL
  # ════════════════════════════════════════════════════════════════════════════

  DBSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: !Sub "${EnvironmentName} DB subnet group"
      SubnetIds:
        - !Ref PrivateSubnet1
        - !Ref PrivateSubnet2
      Tags:
        - Key: Name
          Value: !Sub "${EnvironmentName}-db-subnet-group"

  RDSInstance:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    Properties:
      DBInstanceIdentifier: !Sub "${EnvironmentName}-postgres"
      DBInstanceClass: !Ref DBInstanceClass
      Engine: postgres
      EngineVersion: "15.13"
      MasterUsername: !Ref DBUsername
      MasterUserPassword: !Ref DBPassword
      DBName: !Ref DBName
      AllocatedStorage: "20"
      StorageType: gp2
      StorageEncrypted: true
      MultiAZ: false
      PubliclyAccessible: false
      DBSubnetGroupName: !Ref DBSubnetGroup
      VPCSecurityGroups:
        - !Ref DBSecurityGroup
      # Free Tier accounts cap backup retention and disallow Performance Insights.
      BackupRetentionPeriod: !Ref DBBackupRetentionDays
      PreferredMaintenanceWindow: "sun:04:00-sun:05:00"
      Tags:
        - Key: Name
          Value: !Sub "${EnvironmentName}-rds"

  # ════════════════════════════════════════════════════════════════════════════
  # 7. APPLICATION LOAD BALANCER
  # ════════════════════════════════════════════════════════════════════════════

  ApplicationLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub "${EnvironmentName}-alb"
      Scheme: internet-facing
      Type: application
      Subnets:
        - !Ref PublicSubnet1
        - !Ref PublicSubnet2
      SecurityGroups:
        - !Ref ALBSecurityGroup
      Tags:
        - Key: Name
          Value: !Sub "${EnvironmentName}-alb"

  ALBTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub "${EnvironmentName}-tg"
      Port: 3000
      Protocol: HTTP
      VpcId: !Ref VPC
      TargetType: instance
      HealthCheckPath: /api/health
      HealthCheckIntervalSeconds: 30
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher:
        HttpCode: "200"
      Tags:
        - Key: Name
          Value: !Sub "${EnvironmentName}-tg"

  ALBListenerHTTP:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ApplicationLoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref ALBTargetGroup

  # ════════════════════════════════════════════════════════════════════════════
  # 8. LAUNCH TEMPLATE + AUTO SCALING GROUP
  # ════════════════════════════════════════════════════════════════════════════

  LaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateName: !Sub "${EnvironmentName}-lt"
      LaunchTemplateData:
        ImageId: "{{resolve:ssm:/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64}}"
        InstanceType: !Ref InstanceType
        IamInstanceProfile:
          Arn: !GetAtt EC2InstanceProfile.Arn
        SecurityGroupIds:
          - !Ref AppSecurityGroup
        KeyName: !If [HasKeyPair, !Ref KeyPairName, !Ref "AWS::NoValue"]
        BlockDeviceMappings:
          - DeviceName: /dev/xvda
            Ebs:
              VolumeSize: 20
              VolumeType: gp3
              Encrypted: true
        UserData:
          Fn::Base64: !Sub |
            #!/bin/bash
            set -euo pipefail
            exec > >(tee /var/log/userdata.log) 2>&1

            echo "=== FashionWholesale Bootstrap ==="

            # Install Docker
            dnf update -y
            dnf install -y docker aws-cli jq
            systemctl enable docker
            systemctl start docker

            # ECR login
            AWS_REGION=${AWS::Region}
            ACCOUNT_ID=${AWS::AccountId}
            ECR_URI="${ECRRepository.RepositoryUri}"
            IMAGE_TAG=$(aws ssm get-parameter \
              --name "/${EnvironmentName}/CURRENT_IMAGE_TAG" \
              --query "Parameter.Value" --output text 2>/dev/null || echo "latest")
            IMAGE="${!ECR_URI}:${!IMAGE_TAG}"

            aws ecr get-login-password --region ${!AWS_REGION} \
              | docker login --username AWS --password-stdin "${!ECR_URI}"

            # Fetch secrets from SSM
            NEXTAUTH_SECRET=$(aws ssm get-parameter \
              --name "/${EnvironmentName}/NEXTAUTH_SECRET" \
              --with-decryption --query "Parameter.Value" --output text)
            DB_PASSWORD=$(aws ssm get-parameter \
              --name "/${EnvironmentName}/DB_PASSWORD" \
              --with-decryption --query "Parameter.Value" --output text)

            # Build connection string
            DATABASE_URL="postgresql://${DBUsername}:${!DB_PASSWORD}@${RDSInstance.Endpoint.Address}:5432/${DBName}"
            ALB_DNS=$(aws elbv2 describe-load-balancers \
              --names "${EnvironmentName}-alb" \
              --query "LoadBalancers[0].DNSName" --output text 2>/dev/null || echo "localhost")
            NEXTAUTH_URL="http://${!ALB_DNS}"

            # Pull and run the app container
            docker pull "${!IMAGE}"

            docker stop fashionwholesale 2>/dev/null || true
            docker rm   fashionwholesale 2>/dev/null || true

            docker run -d \
              --name fashionwholesale \
              --restart unless-stopped \
              -p 3000:3000 \
              -e DATABASE_URL="${!DATABASE_URL}" \
              -e NEXTAUTH_SECRET="${!NEXTAUTH_SECRET}" \
              -e NEXTAUTH_URL="${!NEXTAUTH_URL}" \
              -e NODE_ENV=production \
              "${!IMAGE}"

            # Run DB migrations (once per instance start — idempotent)
            sleep 5
            docker exec fashionwholesale npx prisma migrate deploy || true

            echo "=== Bootstrap complete ==="

        TagSpecifications:
          - ResourceType: instance
            Tags:
              - Key: Name
                Value: !Sub "${EnvironmentName}-app"
              - Key: Environment
                Value: production

  AutoScalingGroup:
    Type: AWS::AutoScaling::AutoScalingGroup
    DependsOn: NatGateway1
    Properties:
      AutoScalingGroupName: !Sub "${EnvironmentName}-asg"
      LaunchTemplate:
        LaunchTemplateId: !Ref LaunchTemplate
        Version: !GetAtt LaunchTemplate.LatestVersionNumber
      MinSize: !Ref AsgMinSize
      MaxSize: !Ref AsgMaxSize
      DesiredCapacity: !Ref AsgDesiredSize
      VPCZoneIdentifier:
        - !Ref PrivateSubnet1
        - !Ref PrivateSubnet2
      TargetGroupARNs:
        - !Ref ALBTargetGroup
      HealthCheckType: ELB
      HealthCheckGracePeriod: 120
      DefaultInstanceWarmup: 60
      Tags:
        - Key: Name
          Value: !Sub "${EnvironmentName}-instance"
          PropagateAtLaunch: true

  # ── Scaling Policies ──────────────────────────────────────────────────────

  ScaleOutPolicy:
    Type: AWS::AutoScaling::ScalingPolicy
    Properties:
      AutoScalingGroupName: !Ref AutoScalingGroup
      PolicyType: TargetTrackingScaling
      TargetTrackingConfiguration:
        PredefinedMetricSpecification:
          PredefinedMetricType: ASGAverageCPUUtilization
        TargetValue: 60.0

  # ════════════════════════════════════════════════════════════════════════════
  # 9. CLOUDWATCH ALARMS
  # ════════════════════════════════════════════════════════════════════════════

  HighCPUAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${EnvironmentName}-high-cpu"
      AlarmDescription: "ASG average CPU > 80% for 2 consecutive periods"
      MetricName: CPUUtilization
      Namespace: AWS/EC2
      Statistic: Average
      Period: 300
      EvaluationPeriods: 2
      Threshold: 80
      ComparisonOperator: GreaterThanThreshold
      Dimensions:
        - Name: AutoScalingGroupName
          Value: !Ref AutoScalingGroup

  ALB5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${EnvironmentName}-alb-5xx"
      AlarmDescription: "ALB returning 5xx errors"
      MetricName: HTTPCode_ELB_5XX_Count
      Namespace: AWS/ApplicationELB
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 2
      Threshold: 10
      ComparisonOperator: GreaterThanThreshold
      Dimensions:
        - Name: LoadBalancer
          Value: !GetAtt ApplicationLoadBalancer.LoadBalancerFullName

# ─── Outputs ─────────────────────────────────────────────────────────────────
Outputs:
  LoadBalancerDNS:
    Description: Application Load Balancer DNS (use as NEXTAUTH_URL)
    Value: !Sub "http://${ApplicationLoadBalancer.DNSName}"
    Export:
      Name: !Sub "${EnvironmentName}-alb-dns"

  ECRRepositoryURI:
    Description: ECR repository URI for docker push
    Value: !GetAtt ECRRepository.RepositoryUri
    Export:
      Name: !Sub "${EnvironmentName}-ecr-uri"

  RDSEndpoint:
    Description: RDS PostgreSQL endpoint
    Value: !GetAtt RDSInstance.Endpoint.Address
    Export:
      Name: !Sub "${EnvironmentName}-rds-endpoint"

  AutoScalingGroupName:
    Description: Auto Scaling Group name (used in deploy.yml)
    Value: !Ref AutoScalingGroup
    Export:
      Name: !Sub "${EnvironmentName}-asg-name"

  GitHubActionsRoleArn:
    Description: IAM Role ARN — set as AWS_ROLE_ARN GitHub secret
    Value: !GetAtt GitHubActionsRole.Arn
    Export:
      Name: !Sub "${EnvironmentName}-github-role-arn"

  VpcId:
    Description: VPC ID
    Value: !Ref VPC
