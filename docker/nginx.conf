# ─── FashionWholesale Corp — Nginx Reverse Proxy ────────────────────────────
# Rate limiting zone: 10 req/s per IP, burst of 20
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

# Upstream app servers — 3 instances for load balancing
upstream fashion_app {
    least_conn;
    server app1:3000;
    server app2:3000;
    server app3:3000;
    keepalive 32;
}

# HTTP → HTTPS redirect
server {
    listen 80;
    server_name fashionwholesale.com www.fashionwholesale.com;
    return 301 https://$host$request_uri;
}

# Main HTTPS server
server {
    listen 443 ssl http2;
    server_name fashionwholesale.com www.fashionwholesale.com;

    # SSL certificates (managed by certbot/Let's Encrypt)
    ssl_certificate     /etc/letsencrypt/live/fashionwholesale.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fashionwholesale.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;

    # Security headers
    add_header X-Frame-Options           DENY;
    add_header X-Content-Type-Options    nosniff;
    add_header X-XSS-Protection          "1; mode=block";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Gzip compression
    gzip            on;
    gzip_comp_level 5;
    gzip_types      text/plain text/css application/json application/javascript
                    text/xml application/xml text/javascript image/svg+xml;
    gzip_vary       on;
    gzip_min_length 256;

    # Static files — long-lived cache
    location /_next/static/ {
        proxy_pass http://fashion_app;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location /public/ {
        proxy_pass http://fashion_app;
        expires 30d;
        add_header Cache-Control "public";
    }

    # API routes — rate limited
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;
        limit_req_status 429;

        proxy_pass         http://fashion_app;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }

    # App — all other routes
    location / {
        limit_req zone=api_limit burst=20 nodelay;

        proxy_pass         http://fashion_app;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Health check — no rate limit, no logging
    location /api/health {
        proxy_pass http://fashion_app;
        access_log off;
    }

    # Block hidden files
    location ~ /\. {
        deny all;
    }
}
