# ─────────────────────────────────────────────────────────────────────────────
# FashionWholesale Corp — AWS CI/CD Pipeline
#
# Architecture:
#   Push to main
#     → Lint + type-check
#     → Build Next.js
#     → Build Docker image
#     → Push to ECR (Elastic Container Registry)
#     → Update Launch Template with new image
#     → Trigger Instance Refresh on Auto Scaling Group
#       (rolls out new containers with zero downtime via ALB)
#
# Authentication:
#   Uses GitHub OIDC → AWS IAM role federation.
#   No long-lived AWS credentials stored in secrets.
#
# Required GitHub Secrets:
#   AWS_ROLE_ARN          — IAM role ARN output by setup.sh
#   AWS_REGION            — e.g. us-east-1
#   ECR_REPOSITORY_URI    — ECR repo URI output by setup.sh
#   ASG_NAME              — Auto Scaling Group name from setup.sh
# ─────────────────────────────────────────────────────────────────────────────

name: Deploy to AWS

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_refresh:
        description: "Force instance refresh even if no code changed"
        required: false
        default: "false"

permissions:
  id-token: write   # Required for OIDC token
  contents: read

env:
  NODE_VERSION: "20"
  IMAGE_TAG: ${{ github.sha }}

jobs:
  # ── Job 1: Lint & Type Check ────────────────────────────────────────────────
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

  # ── Job 2: Build Next.js ────────────────────────────────────────────────────
  build:
    name: Next.js Build
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      # Build with dummy vars — real secrets come from SSM at runtime
      - name: Build Next.js
        run: npm run build
        env:
          DATABASE_URL: "file:./dev.db"
          NEXTAUTH_SECRET: "ci-placeholder-not-used-in-prod"
          NEXTAUTH_URL: "http://localhost:3000"

  # ── Job 3: Build & Push Docker Image to ECR ─────────────────────────────────
  docker:
    name: Build & Push to ECR
    runs-on: ubuntu-latest
    needs: build
    outputs:
      image_uri: ${{ steps.build.outputs.image_uri }}

    steps:
      - uses: actions/checkout@v4

      # Authenticate to AWS via OIDC (no stored keys)
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      # Login to ECR
      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      # Build the Docker image using the multi-stage Dockerfile
      # Cache layers from the previous "latest" push to speed up builds
      - name: Build, tag, and push Docker image
        id: build
        env:
          ECR_URI: ${{ secrets.ECR_REPOSITORY_URI }}
        run: |
          docker build \
            -f docker/Dockerfile \
            --cache-from "$ECR_URI:latest" \
            -t "$ECR_URI:${{ env.IMAGE_TAG }}" \
            -t "$ECR_URI:latest" \
            .

          docker push "$ECR_URI:${{ env.IMAGE_TAG }}"
          docker push "$ECR_URI:latest"

          echo "image_uri=$ECR_URI:${{ env.IMAGE_TAG }}" >> "$GITHUB_OUTPUT"

      # Store the current image tag in SSM so new EC2 instances pull the right image
      - name: Update current image tag in SSM
        run: |
          aws ssm put-parameter \
            --name "/fashionwholesale/CURRENT_IMAGE_TAG" \
            --value "${{ env.IMAGE_TAG }}" \
            --type String \
            --overwrite \
            --region "${{ secrets.AWS_REGION }}"

  # ── Job 4: Deploy via ASG Instance Refresh ──────────────────────────────────
  deploy:
    name: Deploy to Auto Scaling Group
    runs-on: ubuntu-latest
    needs: docker
    environment: production

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      # No launch-template edit is needed: the instance UserData reads the
      # image tag from SSM (/fashionwholesale/CURRENT_IMAGE_TAG) at boot, and
      # the docker job above already set that parameter to this commit's SHA.
      # A rolling instance refresh relaunches the instances, which then pull
      # the new image. This avoids needing ec2:RunInstances / launch-template
      # mutation permissions on the CI role.
      - name: Confirm target image tag
        run: |
          TAG=$(aws ssm get-parameter \
            --name "/fashionwholesale/CURRENT_IMAGE_TAG" \
            --query "Parameter.Value" --output text)
          echo "Instances will pull image tag: $TAG"
          [ "$TAG" = "${{ env.IMAGE_TAG }}" ] || echo "Warning: SSM tag ($TAG) != build SHA (${{ env.IMAGE_TAG }})"

      # Trigger a rolling Instance Refresh.
      # ASG replaces instances one by one, keeping min healthy % at 50%.
      # New instances run health check via ALB before old ones are terminated.
      # SkipMatching is false so every instance is replaced even though the
      # launch template itself is unchanged (the new image comes via SSM).
      - name: Start Instance Refresh (rolling deploy)
        env:
          ASG_NAME: ${{ secrets.ASG_NAME }}
        run: |
          REFRESH_ID=$(aws autoscaling start-instance-refresh \
            --auto-scaling-group-name "$ASG_NAME" \
            --strategy Rolling \
            --preferences '{
              "MinHealthyPercentage": 50,
              "InstanceWarmup": 120,
              "CheckpointPercentages": [50, 100],
              "CheckpointDelay": 60,
              "SkipMatching": false
            }' \
            --query "InstanceRefreshId" \
            --output text)

          echo "Instance refresh started: $REFRESH_ID"
          echo "Monitoring rollout (timeout: 15 min)..."

          # Poll until the refresh completes or fails
          for i in $(seq 1 30); do
            STATUS=$(aws autoscaling describe-instance-refreshes \
              --auto-scaling-group-name "$ASG_NAME" \
              --instance-refresh-ids "$REFRESH_ID" \
              --query "InstanceRefreshes[0].Status" \
              --output text)

            PCT=$(aws autoscaling describe-instance-refreshes \
              --auto-scaling-group-name "$ASG_NAME" \
              --instance-refresh-ids "$REFRESH_ID" \
              --query "InstanceRefreshes[0].PercentageComplete" \
              --output text 2>/dev/null || echo "0")

            echo "  [${i}/30] Status: $STATUS — ${PCT}% complete"

            case "$STATUS" in
              Successful) echo "Deployment successful!"; exit 0 ;;
              Failed|Cancelled|RollbackFailed)
                echo "Deployment $STATUS — check ASG console"
                exit 1 ;;
            esac

            sleep 30
          done

          echo "Timed out waiting for instance refresh"
          exit 1

      # Post-deploy: verify the ALB health check passes
      - name: Smoke test — ALB health check
        run: |
          echo "Waiting for health check..."
          sleep 30
          # The ALB DNS is a CloudFormation output — fetch it
          ALB_DNS=$(aws cloudformation describe-stacks \
            --stack-name fashionwholesale-prod \
            --query "Stacks[0].Outputs[?OutputKey=='LoadBalancerDNS'].OutputValue" \
            --output text)

          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$ALB_DNS/api/health" || echo "000")
          echo "Health check HTTP status: $HTTP_CODE"
          [ "$HTTP_CODE" = "200" ] || { echo "Health check failed!"; exit 1; }
          echo "Smoke test passed ✓"
