# ─────────────────────────────────────────────────────────────────────────────
# FashionWholesale Corp — AWS CI/CD Pipeline
#
# Architecture:
#   Push to main
#     ├─ Lint + type-check ─┐  (runs in parallel)
#     └─ Build Docker image ┘
#          → Push to ECR (Elastic Container Registry)
#          → Record image tag in SSM
#     → In-place rolling deploy via SSM:
#         on each running instance (one at a time), pull the new image and
#         restart the container, health-checking before moving to the next.
#
# Why in-place instead of an ASG instance refresh?
#   An instance refresh boots brand-new EC2 instances (OS boot + ECR pull +
#   warmup), which dominated deploy time (~11 min). Pulling the image and
#   restarting the container on the existing instances does the same rollout
#   in ~1-2 min. StartInstanceRefresh remains available as a manual fallback.
#
# Authentication:
#   Uses GitHub OIDC → AWS IAM role federation. No long-lived AWS credentials.
#
# Required GitHub Secrets:
#   AWS_ROLE_ARN          — IAM role ARN output by setup.sh
#   AWS_REGION            — e.g. ap-south-1
#   ECR_REPOSITORY_URI    — ECR repo URI output by setup.sh
#   ASG_NAME              — Auto Scaling Group name from setup.sh
# ─────────────────────────────────────────────────────────────────────────────

name: Deploy to AWS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write   # Required for OIDC token
  contents: read

# Only one deploy at a time; a newer push supersedes an in-flight rollout.
concurrency:
  group: deploy-aws
  cancel-in-progress: false

env:
  NODE_VERSION: "20"
  IMAGE_TAG: ${{ github.sha }}

jobs:
  # ── Lint & Type Check (runs in parallel with the Docker build) ───────────────
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npx tsc --noEmit

  # ── Build & Push Docker Image to ECR ─────────────────────────────────────────
  # The Docker build runs `npm run build` internally, so there is no separate
  # Next.js build job — that would just rebuild the same thing.
  docker:
    name: Build & Push to ECR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push Docker image
        id: build
        env:
          ECR_URI: ${{ secrets.ECR_REPOSITORY_URI }}
        run: |
          docker build \
            -f docker/Dockerfile \
            --cache-from "$ECR_URI:latest" \
            -t "$ECR_URI:${{ env.IMAGE_TAG }}" \
            -t "$ECR_URI:latest" \
            .
          docker push "$ECR_URI:${{ env.IMAGE_TAG }}"
          docker push "$ECR_URI:latest"

      - name: Record current image tag in SSM
        run: |
          aws ssm put-parameter \
            --name "/fashionwholesale/CURRENT_IMAGE_TAG" \
            --value "${{ env.IMAGE_TAG }}" \
            --type String \
            --overwrite \
            --region "${{ secrets.AWS_REGION }}"

  # ── In-place rolling deploy via SSM ──────────────────────────────────────────
  deploy:
    name: Deploy (in-place rolling)
    runs-on: ubuntu-latest
    needs: [lint, docker]
    environment: production

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - uses: actions/checkout@v4

      - name: Roll out new image to running instances
        env:
          ASG_NAME: ${{ secrets.ASG_NAME }}
          REGION: ${{ secrets.AWS_REGION }}
        run: |
          set -euo pipefail

          # Find InService instances in the ASG.
          INSTANCE_IDS=$(aws autoscaling describe-auto-scaling-groups \
            --auto-scaling-group-names "$ASG_NAME" \
            --query "AutoScalingGroups[0].Instances[?LifecycleState=='InService'].InstanceId" \
            --output text --region "$REGION")
          echo "Target instances: $INSTANCE_IDS"
          if [ -z "$INSTANCE_IDS" ]; then echo "No InService instances found"; exit 1; fi

          # The remote script is self-contained (see infrastructure/deploy-remote.sh).
          PARAMS=$(jq -Rs '{commands:[.]}' infrastructure/deploy-remote.sh)

          # Roll one instance at a time, halting on the first failure.
          CMD_ID=$(aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --instance-ids $INSTANCE_IDS \
            --max-concurrency "1" \
            --max-errors "0" \
            --comment "In-place deploy ${{ env.IMAGE_TAG }}" \
            --parameters "$PARAMS" \
            --query "Command.CommandId" --output text --region "$REGION")
          echo "SSM command: $CMD_ID"

          # Wait for every targeted instance to finish.
          for ID in $INSTANCE_IDS; do
            echo "Waiting for $ID ..."
            for i in $(seq 1 40); do
              ST=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$ID" \
                --query "Status" --output text --region "$REGION" 2>/dev/null || echo "Pending")
              echo "  $ID: $ST"
              case "$ST" in
                Success) break ;;
                Failed|Cancelled|TimedOut)
                  echo "Deploy failed on $ID — output:"
                  aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$ID" \
                    --query "StandardErrorContent" --output text --region "$REGION" | tail -20
                  exit 1 ;;
              esac
              sleep 10
            done
          done
          echo "Rollout complete on all instances."

      - name: Smoke test — ALB health check
        env:
          REGION: ${{ secrets.AWS_REGION }}
        run: |
          sleep 10
          ALB_DNS=$(aws cloudformation describe-stacks \
            --stack-name fashionwholesale-prod \
            --query "Stacks[0].Outputs[?OutputKey=='LoadBalancerDNS'].OutputValue" \
            --output text --region "$REGION")
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "http://$ALB_DNS/api/health" || echo "000")
          echo "ALB health check: $HTTP_CODE"
          [ "$HTTP_CODE" = "200" ] || { echo "Smoke test failed!"; exit 1; }
          echo "Smoke test passed ✓"
